plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.memorylens.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.memorylens.app"
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Room schema export directory
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // Prevent aapt from compressing model weight files (would corrupt them)
    aaptOptions {
        noCompress "tflite", "pte", "bin"
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX
    def camerax_version = "1.3.2"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // Lifecycle & ViewModel
    def lifecycle_version = "2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Kotlin Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'

    // Room Database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // ML Kit Face Detection — on-device, no model file needed, works offline
    // Replaces MediaPipe Tasks Vision (which required NormalizationOptions metadata
    // that the Qualcomm AI Hub float32 model does not embed).
    implementation 'com.google.mlkit:face-detection:16.1.5'
    // Coroutine .await() extension for Google Tasks API
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.7.3'

    // TensorFlow Lite — primary runtime for MobileFaceNet (cavaface.tflite)
    implementation 'org.tensorflow:tensorflow-lite:2.14.0'
    implementation 'org.tensorflow:tensorflow-lite-support:0.4.4'
    // TFLite GPU delegate — Mali GPU on A34, falls back to CPU on NoClassDefFoundError
    implementation 'org.tensorflow:tensorflow-lite-gpu:2.14.0'

    // MediaPipe Tasks Vision — kept for future reference; not used in current pipeline
    // implementation 'com.google.mediapipe:tasks-vision:0.10.9'

    // Gson — periodic JSON perf log to /sdcard/
    implementation 'com.google.code.gson:gson:2.10.1'

    // RecyclerView — enrolled persons list
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ---------------------------------------------------------------------------
    // TODO (Hackathon – S25 Ultra): Re-enable ExecuTorch AAR when Llama .pte
    // is available. Place the .aar in app/libs/ and uncomment the line below.
    // implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // ---------------------------------------------------------------------------
}
